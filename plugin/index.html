<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Noisecore Dreamlog</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <sp-theme scale="medium" color="darkest">
      <div id="panel-root">
        <header class="panel-header">
          <h1>NOISECORE // DREAMLOG</h1>
          <p class="panel-subtitle">Card generator</p>
        </header>

        <main id="sections"></main>

        <footer class="panel-footer">
          <sp-button variant="cta" id="btn-create-card">Create Card</sp-button>
          <sp-button variant="secondary" id="btn-update-card">Update Existing</sp-button>
        </footer>
      </div>
    </sp-theme>
    <script src="main.js"></script>
  </body>
</html>
